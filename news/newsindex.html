<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News Home</title>
<meta name="description" content="Welcome to the new home of Pitchball, the new and rising sport born in Athens, Greece.">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">

<style>
:root {
  --bg:       #0e1009;
  --bg2:      #151a0d;
  --green:    #39c877;
  --green-dim:#1a3d2a;
  --olive:    #535c2f;
  --text:     #D7DBC8;
  --muted:    #6b7355;
  --gold:     #f5c842;
  --red:      #e74c3c;
  --border:   rgba(83,92,47,0.4);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── NOISE OVERLAY ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
}

/* ── TICKER ── */
.ticker-wrap {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 32px;
  background: var(--green);
  overflow: hidden;
  z-index: 100;
  display: flex;
  align-items: center;
}
.ticker-track {
  display: flex;
  gap: 0;
  white-space: nowrap;
  animation: ticker 28s linear infinite;
}
.ticker-item {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 13px;
  letter-spacing: 1px;
  color: #000;
  padding: 0 32px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.ticker-item::after {
  content: '◆';
  font-size: 8px;
  opacity: 0.4;
}
@keyframes ticker {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* ── HERO ── */
.hero {
  position: relative;
  min-height: 100vh;
  display: grid;
  grid-template-rows: 1fr auto;
  padding-top: 32px;
  z-index: 1;
}

/* Background diagonal grid */
.hero::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(83,92,47,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(83,92,47,0.06) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
}

.hero-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4rem 1.5rem 2rem;
  position: relative;
  z-index: 2;
}

/* Glowing orb behind logo */
.hero-glow {
  position: absolute;
  width: 600px;
  height: 400px;
  background: radial-gradient(ellipse, rgba(57,200,119,0.08) 0%, transparent 70%);
  pointer-events: none;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -60%);
}

.eyebrow {
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--green);
  margin-bottom: 1.25rem;
  opacity: 0;
  animation: fadeUp 0.6s 0.2s forwards;
}

.logo-wrap {
  display: flex;
  align-items: baseline;
  gap: 0;
  opacity: 0;
  animation: fadeUp 0.7s 0.35s forwards;
}

.logo-main {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(72px, 14vw, 140px);
  letter-spacing: -1px;
  line-height: 0.9;
  color: var(--text);
}

.logo-accent {
  color: var(--green);
}

.logo-super {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(20px, 4vw, 38px);
  letter-spacing: 6px;
  color: var(--muted);
  margin-left: 12px;
  align-self: flex-end;
  padding-bottom: 12px;
}

.tagline {
  font-size: 13px;
  font-weight: 300;
  font-style: italic;
  color: var(--muted);
  margin-top: 1rem;
  letter-spacing: 0.5px;
  opacity: 0;
  animation: fadeUp 0.7s 0.5s forwards;
}

/* Live badge */
.live-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--green-dim);
  border: 1px solid var(--green);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 11px;
  font-weight: 500;
  color: var(--green);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-top: 1.5rem;
  opacity: 0;
  animation: fadeUp 0.7s 0.65s forwards;
}
.live-dot {
  width: 6px; height: 6px;
  background: var(--green);
  border-radius: 50%;
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.8)} }

/* ── SEASON GRID ── */
.seasons-section {
  padding: 0 1.5rem 5rem;
  max-width: 900px;
  margin: 0 auto;
  width: 100%;
  position: relative;
  z-index: 2;
  opacity: 0;
  animation: fadeUp 0.8s 0.8s forwards;
}

.section-label {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 12px;
  letter-spacing: 3px;
  color: var(--olive);
  margin-bottom: 1.25rem;
  display: flex;
  align-items: center;
  gap: 12px;
}
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.seasons-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

/* Featured (PSL5) spans full width */
.season-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 1.25rem 1.5rem;
  text-decoration: none;
  color: inherit;
  transition: border-color 0.2s, transform 0.2s, background 0.2s;
  position: relative;
  overflow: hidden;
}
.season-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, transparent 60%, rgba(57,200,119,0.04));
  pointer-events: none;
}
.season-card:hover {
  border-color: var(--green);
  transform: translateY(-2px);
  background: #1a1f0f;
}
.season-card.featured {
  grid-column: 1 / -1;
  border-color: var(--green);
  background: #111a0f;
  padding: 1.75rem 2rem;
}
.season-card.featured::before {
  background: linear-gradient(135deg, rgba(57,200,119,0.06) 0%, transparent 60%);
}
.season-card.special {
  border-color: rgba(245,200,66,0.3);
}
.season-card.news {
  border-color: rgba(0, 255, 200, 0.3);
}
.season-card.special:hover { border-color: var(--gold); }


.card-left { display: flex; flex-direction: column; gap: 4px; }

.card-season {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 1px;
  color: var(--text);
  line-height: 1;
}
.season-card.featured .card-season { font-size: 40px; color: var(--green); }
.season-card.special .card-season { color: var(--gold); }

.card-desc {
  font-size: 12px;
  font-weight: 300;
  color: var(--muted);
  max-width: 320px;
  line-height: 1.5;
}
.season-card.featured .card-desc { font-size: 13px; }

.card-pill {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 20px;
  flex-shrink: 0;
}
.pill-live    { background: var(--green-dim); color: var(--green); border: 1px solid rgba(57,200,119,0.3); }
.pill-done    { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.pill-special { background: rgba(245,200,66,0.1); color: var(--gold); border: 1px solid rgba(245,200,66,0.3); }

.arrow {
  font-size: 20px;
  color: var(--olive);
  transition: transform 0.2s, color 0.2s;
  flex-shrink: 0;
  margin-left: 1rem;
}
.season-card:hover .arrow { transform: translateX(4px); color: var(--green); }
.season-card.special:hover .arrow { color: var(--gold); }

/* ── FOOTER BAR ── */
.footer-bar {
  position: relative;
  z-index: 2;
  border-top: 1px solid var(--border);
  padding: 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1rem;
  max-width: 900px;
  margin: 0 auto;
  width: 100%;
  opacity: 0;
  animation: fadeUp 0.8s 1s forwards;
}

.socials {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.social-btn {
  display: flex;
  align-items: center;
  gap: 7px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 6px 14px;
  text-decoration: none;
  color: var(--muted);
  font-size: 12px;
  font-weight: 400;
  transition: all 0.15s;
}
.social-btn:hover { border-color: var(--green); color: var(--text); }

.footer-copy {
  font-size: 11px;
  color: var(--muted);
  font-weight: 300;
}

/* ── COOKIE BANNER ── */
#cookie-banner {
  position: fixed;
  bottom: 1rem;
  left: 50%;
  transform: translateX(-50%);
  background: #1e2410;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 12px;
  color: var(--muted);
  z-index: 9999;
  white-space: nowrap;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
#cookie-banner button {
  padding: 5px 14px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  border: none;
  transition: all 0.15s;
}
.btn-accept { background: var(--green); color: #000; }
.btn-accept:hover { background: #2fb366; }
.btn-reject { background: transparent; color: var(--muted); border: 1px solid var(--border) !important; }
.btn-reject:hover { color: var(--text); }

/* ── ANIMATIONS ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── DECORATIVE NUMBERS ── */
.deco-num {
  position: absolute;
  font-family: 'Bebas Neue', sans-serif;
  color: rgba(83,92,47,0.07);
  pointer-events: none;
  user-select: none;
  z-index: 1;
}

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  .seasons-grid { grid-template-columns: 1fr; }
  .season-card.featured { grid-column: 1; }
  .footer-bar { justify-content: center; text-align: center; }
  .logo-super { display: none; }
  .ticker-item { padding: 0 20px; }
  #cookie-banner { flex-direction: column; white-space: normal; text-align: center; bottom: 0; border-radius: 12px 12px 0 0; width: 100%; left: 0; transform: none; }
}
</style>
</head>
