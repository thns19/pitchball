<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Article — Pitchball Super League</title>
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #1a0a00;
  --bg2:     rgba(20,8,0,0.82);
  --orange:  #ff8c00;
  --amber:   #ffb300;
  --text:    #fff8ee;
  --muted:   rgba(255,220,150,0.55);
  --border:  rgba(255,140,0,0.25);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  background-image: url("bg.png");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  line-height: 1.6;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background: rgba(18, 5, 0, 0.72);
  pointer-events: none; z-index: 0;
}

.wrap { max-width: 800px; margin: 0 auto; padding: 2rem 1.5rem; position: relative; z-index: 1; }

.back-link {
  font-size: 13px; color: var(--muted); text-decoration: none;
  display: inline-flex; align-items: center; gap: 6px;
  margin-bottom: 2rem; transition: color 0.2s;
}
.back-link:hover { color: var(--amber); }

.article-header { margin-bottom: 2rem; }
.article-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
.article-tag {
  font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
  padding: 4px 10px; border-radius: 4px;
  background: rgba(255,179,0,0.15); color: var(--amber); border: 1px solid rgba(255,179,0,0.3);
}
.article-title {
  font-family: 'Lora', serif; font-size: clamp(28px, 5vw, 42px);
  font-weight: 600; line-height: 1.2; margin-bottom: 1rem;
}
.article-meta { font-size: 13px; color: var(--muted); display: flex; gap: 12px; align-items: center; }

.hero-image {
  width: 100%; aspect-ratio: 21/9; object-fit: cover;
  border-radius: 12px; border: 1px solid var(--border);
  margin-bottom: 2.5rem; background: var(--bg2);
}

.article-content {
  font-family: 'Lora', serif; font-size: 17px; color: #fdf6ec;
  background: var(--bg2); padding: 2.5rem; border-radius: 12px;
  border: 1px solid var(--border); backdrop-filter: blur(12px);
}
.article-content p { margin-bottom: 1.5rem; }
.article-content p:last-child { margin-bottom: 0; }

.loading, .error-state { text-align: center; padding: 5rem 2rem; color: var(--muted); }
.error-state { color: #e74c3c; }
</style>
</head>
<body>

<div class="wrap">
  <a href="newsindex.html" class="back-link">← Back to News</a>
  <div id="content"><div class="loading">Loading article...</div></div>
</div>

<script>
const PSL_DB_URL = 'https://ptchbl2-default-rtdb.europe-west1.firebasedatabase.app/.json';

// Simple Auth loading to maintain the widget
let pslCurrentUser = null;
function pslLoadSession(){const s=localStorage.getItem('psl_session');return s?JSON.parse(s):null;}

async function loadArticle() {
  const urlParams = new URLSearchParams(window.location.search);
  const articleId = urlParams.get('id');
  const container = document.getElementById('content');

  if (!articleId) {
    container.innerHTML = '<div class="error-state">Article not found.</div>';
    return;
  }

  try {
    const res = await fetch(PSL_DB_URL);
    const db = await res.json();
    const article = (db.news || {})[articleId];

    if (!article) {
      container.innerHTML = '<div class="error-state">Article not found or has been deleted.</div>';
      return;
    }

    const tags = (article.tags || []).map(t => `<span class="article-tag">${t}</span>`).join('');
    const date = article.date ? new Date(article.date).toLocaleDateString('en-GB', {day:'numeric',month:'long',year:'numeric'}) : '';
    const author = article.author ? `by ${article.author}` : '';
    const image = article.image ? `<img src="${article.image}" class="hero-image" alt="Cover Image">` : '';
    
    // Format body: convert double line breaks to paragraphs
    const formattedBody = (article.body || '').split('\n\n').map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');

    container.innerHTML = `
      <div class="article-header">
        ${tags ? `<div class="article-tags">${tags}</div>` : ''}
        <h1 class="article-title">${article.title}</h1>
        <div class="article-meta">
          <span>${date}</span>
          ${author ? `<span>•</span><span>${author}</span>` : ''}
        </div>
      </div>
      ${image}
      <div class="article-content">
        ${formattedBody}
      </div>
    `;
  } catch(e) {
    container.innerHTML = '<div class="error-state">Error loading article. Please try again.</div>';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  pslCurrentUser = pslLoadSession();
  if(typeof renderWidget === 'function') renderWidget();
  loadArticle();
});
</script>

<!-- Inject Auth Script from main file to keep the top-right menu working -->
<script>
function injectAuthStyles(){if(document.getElementById('psl-auth-styles'))return;const s=document.createElement('style');s.id='psl-auth-styles';s.textContent=`#psl-auth-widget{position:fixed;top:12px;right:14px;z-index:99999;font-family:system-ui,sans-serif;}.psl-aw-btn{display:flex;align-items:center;gap:7px;background:rgba(20,20,20,0.92);border:1px solid rgba(255,255,255,0.2);border-radius:20px;padding:6px 12px 6px 8px;cursor:pointer;backdrop-filter:blur(8px);font-size:12px;color:#fff;font-weight:500;}.psl-aw-avatar{width:22px;height:22px;border-radius:50%;background:#39c877;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#000;flex-shrink:0;}.psl-aw-avatar.guest{background:rgba(255,255,255,0.15);color:#fff;font-size:13px;}`;document.head.appendChild(s);}
function renderWidget(){if(!document.body){setTimeout(renderWidget,50);return;}const ex=document.getElementById('psl-auth-widget');if(ex)ex.remove();const w=document.createElement('div');w.id='psl-auth-widget';if(pslCurrentUser){const avatarBtn=pslCurrentUser.avatar?`<img src="${pslCurrentUser.avatar}" style="width:22px;height:22px;border-radius:50%;object-fit:cover;">`:`<div class="psl-aw-avatar">${pslCurrentUser.username[0].toUpperCase()}</div>`;w.innerHTML=`<div class="psl-aw-btn" onclick="location.href='newsindex_2.html'">${avatarBtn}<span>${pslCurrentUser.username}</span></div>`;}else{w.innerHTML=`<div class="psl-aw-btn" onclick="location.href='newsindex_2.html'"><div class="psl-aw-avatar guest">👤</div><span>Sign in</span></div>`;}document.body.appendChild(w);}
injectAuthStyles();
</script>
</body>
</html>
