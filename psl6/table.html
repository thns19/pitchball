<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League Table — PSL6</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --space-dark: #05010f;
    --neon-purple: #b366ff;
    --neon-cyan: #00f0ff;
    --text-main: #ffffff;
    --text-muted: rgba(255, 255, 255, 0.5);
    --border-color: rgba(255, 255, 255, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100vh;
  }

  body {
    font-family: 'Space Grotesk', sans-serif;
    background-color: var(--space-dark);
    background-image: url('bg.png');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(5, 1, 15, 0.85);
    z-index: 0;
    pointer-events: none;
  }

  .stars {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
  }
  .stars::before, .stars::after {
    content: ''; position: absolute; width: 2px; height: 2px;
    background: transparent;
    box-shadow:
      10vw 20vh #fff, 40vw 80vh #fff, 80vw 10vh #fff, 20vw 90vh #fff,
      60vw 50vh #fff, 90vw 70vh #fff, 30vw 40vh #fff, 70vw 20vh #fff,
      50vw 10vh #fff, 15vw 60vh #fff, 85vw 90vh #fff, 95vw 30vh #fff;
    animation: twinkle 4s infinite alternate;
  }
  .stars::after {
    width: 3px; height: 3px;
    box-shadow:
      25vw 15vh var(--neon-cyan), 75vw 85vh var(--neon-purple), 5vw 50vh var(--neon-cyan),
      55vw 95vh var(--neon-purple), 45vw 35vh var(--neon-cyan), 85vw 55vh var(--neon-purple);
    animation: twinkle 3s infinite alternate-reverse;
  }
  @keyframes twinkle {
    0% { opacity: 0.2; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1.2); }
  }

  .container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 720px;
    padding: 3rem 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .eyebrow {
    font-size: clamp(0.7rem, 1.5vh, 0.85rem);
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 1rem;
  }

  .icon-badge {
    font-size: clamp(2.5rem, 6vh, 3.5rem);
    margin-bottom: 1rem;
    filter: grayscale(0.15);
  }

  .title {
    font-size: clamp(2.2rem, 6vh, 3.2rem);
    font-weight: 300;
    line-height: 1.1;
    letter-spacing: -1px;
    margin-bottom: 0.75rem;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    border-radius: 999px;
    border: 1px solid var(--border-color);
    background: rgba(255, 255, 255, 0.03);
    font-size: 0.75rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--neon-cyan);
    font-weight: 600;
    margin-bottom: 1.75rem;
  }
  .status-pill .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--neon-cyan);
    box-shadow: 0 0 8px var(--neon-cyan);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .desc {
    font-size: clamp(0.95rem, 2vh, 1.05rem);
    color: var(--text-muted);
    font-weight: 300;
    max-width: 480px;
    line-height: 1.6;
    margin-bottom: 2.5rem;
  }

  .back-link {
    color: var(--text-muted);
    text-decoration: none;
    font-size: clamp(0.8rem, 1.8vh, 0.9rem);
    border: 1px solid var(--border-color);
    padding: 10px 22px;
    border-radius: 999px;
    transition: all 0.25s ease;
  }
  .back-link:hover {
    color: var(--text-main);
    border-color: var(--neon-purple);
    box-shadow: 0 0 16px rgba(179, 102, 255, 0.25);
  }

  .container {
    max-width: 1100px;
    align-items: stretch;
    text-align: left;
  }

  .page-header { text-align: center; }
  .page-header .icon-badge { text-align: center; }
  .page-header .title { text-align: center; }
  .page-header .status-pill { display: flex; width: fit-content; margin-left: auto; margin-right: auto; }
  .page-header .desc { margin-left: auto; margin-right: auto; text-align: center; }

  .section-heading { margin: 2rem 0 1rem; }
  .section-heading h2 { font-size: 1.35rem; font-weight: 400; color: var(--text-main); }
  .section-heading p { color: var(--text-muted); font-size: 0.85rem; margin-top: 0.35rem; line-height: 1.5; }

  .groups-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    margin-bottom: 1.5rem;
  }
  .group-card {
    background: rgba(31, 24, 42, 0.82);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 1rem;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
  }
  .group-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--neon-cyan);
    margin-bottom: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .group-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .group-table th {
    color: var(--text-muted);
    padding: 6px 8px;
    text-align: center;
    border-bottom: 1px solid var(--border-color);
    font-weight: 600;
  }
  .group-table th:first-child { text-align: left; }
  .group-table td {
    padding: 8px 8px;
    text-align: center;
    border-bottom: 1px solid var(--border-color);
    color: var(--text-main);
    background: rgba(255,255,255,0.01);
  }
  .group-table td:first-child {
    text-align: left;
    font-weight: 500;
  }
  .group-table tr:last-child td { border-bottom: none; }
  .group-qual { border-left: 3px solid #39c877; }
  .group-best4 { border-left: 3px solid #f5c842; }
  .group-elim { border-left: 3px solid rgba(255,255,255,0.12); }
  .team-cell { display: flex; align-items: center; gap: 8px; }
  .logo-preview { width: 18px; height: 18px; object-fit: contain; border-radius: 4px; background: rgba(0,0,0,0.25); border: 1px solid var(--border-color); }
  .fixtures-section {
    margin-top: 14px;
    border-top: 1px solid var(--border-color);
    padding-top: 12px;
  }
  .fixtures-title {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--neon-cyan);
    font-weight: 700;
    margin-bottom: 10px;
  }
  .fixture-md-block {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .fixture-md-header {
    background: rgba(0, 240, 255, 0.08);
    color: var(--neon-cyan);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 7px 10px;
  }
  .fixture-md-body {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 7px;
  }
  .fixture-match {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    gap: 8px;
    align-items: center;
    padding: 7px 9px;
    border-radius: 8px;
    background: rgba(255,255,255,0.015);
    border: 1px solid rgba(255,255,255,0.04);
    font-size: 12px;
  }
  .fixture-team {
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .fixture-team.home { text-align: right; }
  .fixture-team.away { text-align: left; }
  .fixture-score {
    min-width: 54px;
    text-align: center;
    color: var(--neon-purple);
    font-weight: 700;
    font-size: 11px;
  }
  .fixture-empty {
    color: var(--text-muted);
    font-size: 12px;
    padding: 8px 0;
  }
  .save-note { color: var(--text-muted); font-size: 0.75rem; margin-top: 1rem; }
  .groups-placeholder { padding: 2rem; text-align: center; border: 1px dashed var(--border-color); background: rgba(255,255,255,0.02); border-radius: 12px; }
  .groups-placeholder strong { display: block; color: var(--text-main); font-weight: 400; margin-bottom: 0.45rem; }
  .groups-placeholder span { color: var(--text-muted); font-size: 0.82rem; line-height: 1.5; }

  @media (max-width: 700px) {
    .container { padding: 2rem 1rem; }
    .groups-grid { grid-template-columns: 1fr; }
    .fixture-match { grid-template-columns: 1fr auto 1fr; }
  }
</style>
</head>
<body>

  <div class="stars"></div>

  <div class="container">
    <div class="page-header">
      <div class="eyebrow">Pitchball Super League &middot; PSL6</div>
      <div class="icon-badge">📋</div>
      <h1 class="title">League & Groups</h1>
      <div class="status-pill"><span class="dot"></span>Group Stages</div>
      <p class="desc">The PSL6 teams are split into the following groups for the league stage.</p>
    </div>

    <section aria-labelledby="groups-title">
      <div class="section-heading">
        <h2 id="groups-title">Group Stage</h2>
        <p>Fixtures and standings for all PSL6 groups.</p>
      </div>
      <div class="groups-grid" id="groups-grid"></div>
    </section>

    <a href="index.html" class="back-link">&larr; Back to PSL6</a>
  </div>

  <script>
    const teamData = {
      'BADiles': { name: 'BADiles', logo: 'logos/badiles.png' },
      'Volos Drummers': { name: 'Volos Dr.', logo: 'logos/volos.png' },
      'Midi Kidz': { name: 'Midi Kidz', logo: 'logos/midi.png' },
      'Team Till Death': { name: 'Team Till Death', logo: 'logos/ttd.png' },
      'Hornets': { name: 'Hornets', logo: 'logos/hornets.png' },
      'EX7T': { name: 'EX7T', logo: 'logos/ex7t.png' },
      'R1': { name: 'R1', logo: 'logos/r1.png' },
      'Basement Boys': { name: 'Basement Boys', logo: 'logos/basement.png' },
      'Lampater': { name: 'Lampater', logo: 'logos/lpc.png' },
      'Polo': { name: 'Polo', logo: 'logos/polo.png' },
      'Ksades': { name: 'Ksades', logo: 'logos/ksades.png' },
      'Air Condition': { name: 'Air Condition', logo: 'logos/ac.png' },
      'Axtarmades': { name: 'Axtarmades', logo: 'logos/axtar.png' },
      'Thryloi': { name: 'Thryloi', logo: 'logos/thryloi.png' },
      'Spasmena Mila': { name: 'Spasmena Mila', logo: 'logos/spasmena.png' },
      'Warriors': { name: 'Warriors', logo: 'logos/warriors.png' },
      'Niki Alimou': { name: 'Niki Alimou', logo: 'logos/alimou.png' },
      'Golden B.': { name: 'Golden B.', logo: 'logos/gb.png' }
    };

    const TEAM_ALIASES = {
      'BAD': 'BADiles', 'BADiles': 'BADiles',
      'Volos': 'Volos Drummers', 'V. Drummers': 'Volos Dr.', 'Volos Drummers': 'Volos Drummers',
      'Midi': 'Midi Kidz', 'Midi Kidz': 'Midi Kidz',
      'TTD': 'Team Till Death', 'Team Till Death': 'Team Till Death',
      'Hornets': 'Hornets',
      'EX7T': 'EX7T',
      'R1': 'R1',
      'BMB': 'Basement Boys', 'Basement Boys': 'Basement Boys',
      'Lampater': 'Lampater',
      'Polo': 'Polo',
      'Ksades': 'Ksades',
      'A/C': 'Air Condition', 'Air Condition': 'Air Condition',
      'Axtarm': 'Axtarmades', 'Axtarmades': 'Axtarmades',
      'Thryloi': 'Thryloi',
      'Mila': 'Spasmena Mila', 'Spasmena Mila': 'Spasmena Mila',
      'Warriors': 'Warriors',
      'Niki A.': 'Niki Alimou', 'Niki Alimou': 'Niki Alimou',
      'GB': 'Golden B.', 'Golden B.': 'Golden B.'
    };

    const groups = [
      { name: 'Group A', teams: ['BADiles', 'Volos Drummers', 'Midi Kidz', 'Team Till Death', 'Hornets', 'EX7T'], fixtures: [] },
      { name: 'Group B', teams: ['R1', 'Basement Boys', 'Lampater', 'Polo', 'Ksades', 'Air Condition'], fixtures: [] },
      { name: 'Group C', teams: ['Axtarmades', 'Thryloi', 'Spasmena Mila', 'Warriors', 'Niki Alimou', 'Golden B.'], fixtures: [] }
    ];

    const rawFixtures = [
      { group: 'Group A', md: 1, h: 'EX7T', a: 'Midi', hs: null, as: null },
      { group: 'Group A', md: 1, h: 'Hornets', a: 'BAD', hs: null, as: null },
      { group: 'Group A', md: 1, h: 'TTD', a: 'Volos', hs: null, as: null },
      { group: 'Group A', md: 2, h: 'BAD', a: 'EX7T', hs: null, as: null },
      { group: 'Group A', md: 2, h: 'Volos', a: 'Midi', hs: null, as: null },
      { group: 'Group A', md: 2, h: 'TTD', a: 'Hornets', hs: null, as: null },
      { group: 'Group A', md: 3, h: 'EX7T', a: 'Volos', hs: null, as: null },
      { group: 'Group A', md: 3, h: 'BAD', a: 'TTD', hs: null, as: null },
      { group: 'Group A', md: 3, h: 'Midi', a: 'Hornets', hs: null, as: null },
      { group: 'Group A', md: 4, h: 'TTD', a: 'EX7T', hs: null, as: null },
      { group: 'Group A', md: 4, h: 'Hornets', a: 'Volos', hs: null, as: null },
      { group: 'Group A', md: 4, h: 'Midi', a: 'BAD', hs: null, as: null },
      { group: 'Group A', md: 5, h: 'EX7T', a: 'Hornets', hs: null, as: null },
      { group: 'Group A', md: 5, h: 'TTD', a: 'Midi', hs: null, as: null },
      { group: 'Group A', md: 5, h: 'Volos', a: 'BAD', hs: null, as: null },

      { group: 'Group B', md: 1, h: 'Lampater', a: 'Polo', hs: null, as: null },
      { group: 'Group B', md: 1, h: 'A/C', a: 'Ksades', hs: null, as: null },
      { group: 'Group B', md: 1, h: 'BMB', a: 'R1', hs: null, as: null },
      { group: 'Group B', md: 2, h: 'Ksades', a: 'Lampater', hs: null, as: null },
      { group: 'Group B', md: 2, h: 'R1', a: 'Polo', hs: null, as: null },
      { group: 'Group B', md: 2, h: 'BMB', a: 'A/C', hs: null, as: null },
      { group: 'Group B', md: 3, h: 'Lampater', a: 'R1', hs: null, as: null },
      { group: 'Group B', md: 3, h: 'Ksades', a: 'BMB', hs: null, as: null },
      { group: 'Group B', md: 3, h: 'Polo', a: 'A/C', hs: null, as: null },
      { group: 'Group B', md: 4, h: 'BMB', a: 'Lampater', hs: null, as: null },
      { group: 'Group B', md: 4, h: 'A/C', a: 'R1', hs: null, as: null },
      { group: 'Group B', md: 4, h: 'Polo', a: 'Ksades', hs: null, as: null },
      { group: 'Group B', md: 5, h: 'Lampater', a: 'A/C', hs: null, as: null },
      { group: 'Group B', md: 5, h: 'BMB', a: 'Polo', hs: null, as: null },
      { group: 'Group B', md: 5, h: 'R1', a: 'Ksades', hs: null, as: null },

      { group: 'Group C', md: 1, h: 'Axtarm', a: 'Niki A.', hs: null, as: null },
      { group: 'Group C', md: 1, h: 'Thryloi', a: 'GB', hs: null, as: null },
      { group: 'Group C', md: 1, h: 'Mila', a: 'Warriors', hs: null, as: null },
      { group: 'Group C', md: 2, h: 'GB', a: 'Axtarm', hs: null, as: null },
      { group: 'Group C', md: 2, h: 'Warriors', a: 'Niki A.', hs: null, as: null },
      { group: 'Group C', md: 2, h: 'Mila', a: 'Thryloi', hs: null, as: null },
      { group: 'Group C', md: 3, h: 'Axtarm', a: 'Warriors', hs: null, as: null },
      { group: 'Group C', md: 3, h: 'GB', a: 'Mila', hs: null, as: null },
      { group: 'Group C', md: 3, h: 'Niki A.', a: 'Thryloi', hs: null, as: null },
      { group: 'Group C', md: 4, h: 'Mila', a: 'Axtarm', hs: null, as: null },
      { group: 'Group C', md: 4, h: 'Thryloi', a: 'Warriors', hs: null, as: null },
      { group: 'Group C', md: 4, h: 'Niki A.', a: 'GB', hs: null, as: null },
      { group: 'Group C', md: 5, h: 'Axtarm', a: 'Thryloi', hs: null, as: null },
      { group: 'Group C', md: 5, h: 'Mila', a: 'Niki A.', hs: null, as: null },
      { group: 'Group C', md: 5, h: 'Warriors', a: 'GB', hs: null, as: null }
    ];

    function normalizeTeamName(teamName) {
      const key = String(teamName || '').trim();
      return TEAM_ALIASES[key] || key;
    }

    const fixtures = rawFixtures.map((fixture, index) => ({
      ...fixture,
      id: `fixture-${index}`,
      home: normalizeTeamName(fixture.h),
      away: normalizeTeamName(fixture.a),
      hs: fixture.hs ?? null,
      as: fixture.as ?? null,
      confirmed: fixture.hs !== null && fixture.as !== null
    }));

    groups.forEach(group => {
      group.fixtures = fixtures.filter(fixture => fixture.group === group.name);
    });

    function computeGroupStandings(teams, groupFixtures) {
      const standings = teams.map(teamKey => {
        const team = teamData[teamKey] || { name: teamKey, logo: '' };
        return {
          team: team.name,
          logo: team.logo,
          p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0
        };
      });

      const standingsByTeam = new Map(standings.map(row => [row.team, row]));

      (groupFixtures || []).filter(f => f.hs !== null && f.as !== null).forEach(f => {
        const home = standingsByTeam.get(f.home);
        const away = standingsByTeam.get(f.away);
        if (!home || !away) return;

        home.p += 1; away.p += 1;
        home.gf += f.hs; home.ga += f.as;
        away.gf += f.as; away.ga += f.hs;
        home.gd += f.hs - f.as; away.gd += f.as - f.hs;

        if (f.hs > f.as) {
          home.w += 1; home.pts += 3;
          away.l += 1;
        } else if (f.as > f.hs) {
          away.w += 1; away.pts += 3;
          home.l += 1;
        } else {
          home.d += 1; away.d += 1;
          home.pts += 1; away.pts += 1;
        }
      });

      return standings.sort((a, b) => {
        if (b.pts !== a.pts) return b.pts - a.pts;
        if (b.gd !== a.gd) return b.gd - a.gd;
        if (b.gf !== a.gf) return b.gf - a.gf;
        return a.team.localeCompare(b.team);
      });
    }

    function renderGroups() {
      document.getElementById('groups-grid').innerHTML = groups.map(group => {
        const standings = computeGroupStandings(group.teams, group.fixtures);
        const rows = standings.map((row, index) => {
          const cls = index < 3 ? 'group-qual' : index === 3 ? 'group-best4' : 'group-elim';
          return `
            <tr class="${cls}">
              <td>
                <div class="team-cell">
                  <img class="logo-preview" src="${escapeAttribute(row.logo)}" alt="${escapeAttribute(row.team)}" onerror="this.style.display='none'">
                  <span>${escapeHtml(row.team)}</span>
                </div>
              </td>
              <td>${row.p}</td>
              <td>${row.w}</td>
              <td>${row.d}</td>
              <td>${row.l}</td>
              <td>${row.gd > 0 ? '+' + row.gd : row.gd}</td>
              <td><strong>${row.pts}</strong></td>
            </tr>`;
        }).join('');

        const fixtureByMd = Object.values(group.fixtures.reduce((acc, fixture) => {
          const key = String(fixture.md);
          if (!acc[key]) acc[key] = [];
          acc[key].push(fixture);
          return acc;
        }, {}));

        const fixtureRows = fixtureByMd
          .sort((a, b) => Number(a[0].md) - Number(b[0].md))
          .map(matches => `
            <div class="fixture-md-block">
              <div class="fixture-md-header">MD${matches[0].md}</div>
              <div class="fixture-md-body">
                ${matches.map(fixture => {
                  const score = fixture.hs !== null && fixture.as !== null ? `${fixture.hs} - ${fixture.as}` : 'TBD';
                  return `
                    <div class="fixture-match">
                      <span class="fixture-team home">${escapeHtml(fixture.home)}</span>
                      <span class="fixture-score">${score}</span>
                      <span class="fixture-team away">${escapeHtml(fixture.away)}</span>
                    </div>`;
                }).join('')}
              </div>
            </div>`).join('');

        return `
          <article class="group-card">
            <div class="group-title">${escapeHtml(group.name)}</div>
            <table class="group-table">
              <thead>
                <tr>
                  <th>Team</th>
                  <th>P</th>
                  <th>W</th>
                  <th>D</th>
                  <th>L</th>
                  <th>GD</th>
                  <th>Pts</th>
                </tr>
              </thead>
              <tbody>
                ${rows}
              </tbody>
            </table>
            <div class="fixtures-section">
              <div class="fixtures-title">Matchdays</div>
              ${fixtureRows || '<div class="fixture-empty">No fixtures yet.</div>'}
            </div>
          </article>`;
      }).join('');
    }

    function escapeHtml(value) { return String(value).replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character])); }
    function escapeAttribute(value) { return escapeHtml(value); }

    renderGroups();

    let _pslDbCache = null;
    let _pslDbFetching = null;

    async function pslDbGet() {
      if (_pslDbCache) return _pslDbCache;
      if (_pslDbFetching) return _pslDbFetching;
      _pslDbFetching = fetch(PSL_DB_URL)
        .then(r => r.json())
        .then(data => {
          _pslDbCache = data;
          _pslDbFetching = null;
          return _pslDbCache;
        });
      return _pslDbFetching;
    }

    async function pslDbSet(data) {
      _pslDbCache = data;
      await fetch(PSL_DB_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    }

    function pslDbInvalidate() {
      _pslDbCache = null;
    }

    function pslLoadSession() {
      const s = localStorage.getItem('psl_session');
      return s ? JSON.parse(s) : null;
    }

    function pslSaveSession(u) {
      localStorage.setItem('psl_session', JSON.stringify(u));
    }

    function pslClearSession() {
      localStorage.removeItem('psl_session');
    }

    async function pslHashPass(pass) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pass + 'psl5salt'));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

lex;align-items:center;justify-content:space-between;}.psl-modal-title{font-size:16px;font-weight:600;color:#fff;}.psl-modal-close{background:none;border:none;color:rgba(255,255,255,0.4);cursor:pointer;font-size:20px;line-height:1;padding:2px;font-family:inherit;}.psl-modal-bd{padding:1.5rem;}.psl-form-group{margin-bottom:14px;}.psl-label{font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:5px;display:block;font-weight:500;}.psl-input{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;box-sizing:border-box;}.psl-input:focus{outline:none;border-color:#39c877;}.psl-input::placeholder{color:rgba(255,255,255,0.3);}.psl-btn-primary{width:100%;padding:10px;background:#39c877;color:#000;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}.psl-btn-primary:hover{background:#2fb366;}.psl-btn-primary:disabled{opacity:0.4;cursor:not-allowed;}.psl-err{font-size:11px;color:#e74c3c;margin-top:6px;}.psl-ok{font-size:11px;color:#39c877;margin-top:6px;}.psl-tabs{display:flex;margin-bottom:1.5rem;background:rgba(255,255,255,0.06);border-radius:8px;padding:3px;gap:3px;}.psl-tab{flex:1;padding:7px;border:none;background:none;border-radius:6px;font-size:12px;font-weight:600;color:rgba(255,255,255,0.4);cursor:pointer;font-family:inherit;}.psl-tab.active{background:#39c877;color:#000;}.psl-avatar-preview{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.15);display:block;margin:0 auto 12px;}`;

    async function pslSaveAvatar() {
      const url = document.getElementById('psl-avatar-url').value.trim();
      const err = document.getElementById('psl-avatar-err');
      const ok = document.getElementById('psl-avatar-ok');
      const btn = document.getElementById('psl-avatar-btn');
      err.style.display = 'none'; ok.style.display = 'none'; btn.disabled = true; btn.textContent = 'Saving...';
      try {
        const db = await pslDbGet();
        const users = db.users || {};
        const uKey = pslCurrentUser.username.toLowerCase();
        if (!users[uKey]) {
          err.textContent = 'User not found.';
          err.style.display = 'block';
          return;
        }
        users[uKey].avatar = url || null;
        await pslDbSet({ ...db, users });
        pslDbInvalidate();
        pslCurrentUser.avatar = url || null;
        pslSaveSession(pslCurrentUser);
        ok.style.display = 'block';
        setTimeout(() => { pslCloseAuth(); renderWidget(); }, 800);
      } catch (e) {
        err.textContent = 'Connection error. Try again.';
        err.style.display = 'block';
      } finally {
        btn.disabled = false; btn.textContent = 'Save';
      }
    }

      document.getElementById('psl-avatar-url').value = '';

    let _authModal = null;

    function pslOpenAuth(tab = 'login') {
      if (_authModal) _authModal.remove();
      const o = document.createElement('div');
      o.className = 'psl-modal-overlay';
      o.id = 'psl-auth-modal';

      o.addEventListener('click', e => { if (e.target === o) pslCloseAuth(); });
      document.body.appendChild(o); _authModal = o;

    function pslCloseAuth() {
      _authModal?.remove();
      _authModal = null;

    function pslSwitchTab(tab) {
      document.getElementById('psl-tab-login').style.display = tab === 'login' ? '' : 'none';
      document.getElementById('psl-tab-register').style.display = tab === 'register' ? '' : 'none';
      document.querySelectorAll('.psl-tab').forEach((b, i) => b.classList.toggle('active', i === (tab === 'login' ? 0 : 1)));
    }

    async function pslDoLogin() {
      const raw = document.getElementById('psl-li-user').value.trim();
      const pass = document.getElementById('psl-li-pass').value;
      const e = document.getElementById('psl-li-err');
      e.style.display = 'none';
      if (!raw || !pass) {
        e.textContent = 'Please fill in all fields.';
        e.style.display = 'block';
        return;
      }
      const btn = document.getElementById('psl-li-btn');
      btn.disabled = true; btn.textContent = 'Signing in...';
      try {
        const db = await pslDbGet();
        const users = db.users || {};
        const user = Object.values(users).find(u => u.username.toLowerCase() === raw.toLowerCase() || u.email.toLowerCase() === raw.toLowerCase());
        if (!user) {
          e.textContent = 'Account not found.';
          e.style.display = 'block';
          return;
        }
        const hash = await pslHashPass(pass);
        if (hash !== user.passHash) {
          e.textContent = 'Incorrect password.';
          e.style.display = 'block';
          return;
        }
        pslCurrentUser = { username: user.username, email: user.email, avatar: user.avatar || null, isAdmin: user.username.toLowerCase() === PSL_ADMIN };
        pslSaveSession(pslCurrentUser);
        pslCloseAuth();
        renderWidget();
        renderAdminControls();
        if (typeof onPslLogin === 'function') onPslLogin(pslCurrentUser);
      } catch (err) {
        e.textContent = 'Connection error. Try again.';
        e.style.display = 'block';
      } finally {
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    }

    async function pslDoRegister() {
      const username = document.getElementById('psl-rg-user').value.trim();
      const email = document.getElementById('psl-rg-email').value.trim().toLowerCase();
      const pass = document.getElementById('psl-rg-pass').value;
      const e = document.getElementById('psl-rg-err');
      e.style.display = 'none';
      if (!username || !email || !pass) {
        e.textContent = 'Please fill in all fields.';
        e.style.display = 'block';
        return;
      }
      if (username.length < 2) {
        e.textContent = 'Username too short.';
        e.style.display = 'block';
        return;
      }
      if (pass.length < 6) {
        e.textContent = 'Password must be 6+ characters.';
        e.style.display = 'block';
        return;
      }
      const btn = document.getElementById('psl-rg-btn');
      btn.disabled = true; btn.textContent = 'Creating...';
      try {
        const db = await pslDbGet();
        const users = db.users || {};
        if (users[username.toLowerCase()]) {
          e.textContent = 'Username taken.';
          e.style.display = 'block';
          return;
        }
        const passHash = await pslHashPass(pass);
        users[username.toLowerCase()] = { username, email, passHash, avatar: null, joined: new Date().toISOString() };
        await pslDbSet({ ...db, users });
        pslDbInvalidate();
        pslCurrentUser = { username, email, avatar: null, isAdmin: username.toLowerCase() === PSL_ADMIN };
        pslSaveSession(pslCurrentUser);
        pslCloseAuth();
        renderWidget();
        renderAdminControls();
        if (typeof onPslLogin === 'function') onPslLogin(pslCurrentUser);
      } catch (err) {
        e.textContent = 'Connection error. Try again.';
        e.style.display = 'block';
      } finally {
        btn.disabled = false; btn.textContent = 'Create Account';
      }
    }

    function pslLogout() {
      pslClearSession();
      pslCurrentUser = null;
      pslDbInvalidate();
      renderWidget();
      renderAdminControls();
      if (typeof onPslLogout === 'function') onPslLogout();
    }

    async function pslAuthInit() {
      injectAuthStyles();
      const session = pslLoadSession();
      if (session) {
        try {
          const db = await pslDbGet();
          const uData = (db.users || {})[session.username.toLowerCase()];
          if (uData) {
            pslCurrentUser = { username: uData.username, email: uData.email, avatar: uData.avatar || null, isAdmin: uData.username.toLowerCase() === PSL_ADMIN };
            pslSaveSession(pslCurrentUser);
          } else {
            pslClearSession();
          }
        } catch (err) {
          pslCurrentUser = session;
        }
      }
      renderWidget();
      renderAdminControls();
      if (pslCurrentUser && typeof onPslLogin === 'function') onPslLogin(pslCurrentUser);
    }

    async function syncMatchesFromDB() {
      const db = await pslDbGet();
      if (db.matches) {
        fixtures.forEach(f => {
          const overrides = db.matches[f.id];
          if (overrides) {
            f.hs = overrides.hs !== null ? overrides.hs : f.hs;
            f.as = overrides.as !== null ? overrides.as : f.as;
            if (f.hs !== null && f.as !== null) f.confirmed = true;
            f.date = overrides.date || f.date;
            f.mvp = overrides.mvp || f.mvp;
            f.events = overrides.events || f.events;
          }
        });
      }
      if (typeof renderGroups === 'function') renderGroups();
    }

            <div id="ae-events-container" style="display:flex;flex-direction:column;gap:8px;margin-bottom:10px;"></div>
            <button class="psl-btn-primary" style="background:#535c2f; color:#fff; margin-bottom:1.5rem;" onclick="addAdminEvent()">+ Add Event</button>
            <div class="psl-err" id="ae-err" style="display:none;"></div>
            <div class="psl-ok" id="ae-ok" style="display:none;">Saved to Firebase!</div>
            <button class="psl-btn-primary" id="ae-btn" onclick="saveAdminMatch()">Save Match</button>
          </div>
        </div>`;
      document.body.appendChild(o);
      adminEditModal = o;
      loadAdminMatchData();
    }

    async function loadAdminMatchData() {
      const matchId = document.getElementById('ae-match-id').value;
      const f = fixtures.find(x => x.id == matchId);
      if (!f) return;
      adminCurrentHome = f.home;
      adminCurrentAway = f.away;

      const db = await pslDbGet();
      const data = (db.matches || {})[matchId] || {};

      document.getElementById('ae-hs').value = data.hs !== undefined && data.hs !== null ? data.hs : '';
      document.getElementById('ae-as').value = data.as !== undefined && data.as !== null ? data.as : '';
      document.getElementById('ae-date').value = data.date || '';
      document.getElementById('ae-mvp').innerHTML = getPlayerOpts(data.mvp);
      adminEvents = data.events ? JSON.parse(JSON.stringify(data.events)) : [];
      renderAdminEvents();
    }

    function renderAdminEvents() {
      const c = document.getElementById('ae-events-container');
      c.innerHTML = adminEvents.map((ev, i) => `
        <div style="background:rgba(255,255,255,0.05); padding:8px; border-radius:6px; position:relative;">
          <button onclick="removeAdminEvent(${i})" style="position:absolute;top:5px;right:5px;background:none;border:none;color:#e74c3c;cursor:pointer;">✕</button>
          <select class="psl-input" style="margin-bottom:6px; width:calc(100% - 20px);" onchange="updateEvent(${i}, 'type', this.value)">
            <option value="goal" ${ev.type === 'goal' ? 'selected' : ''}>Goal</option>
            <option value="og" ${ev.type === 'og' ? 'selected' : ''}>Own Goal</option>
            <option value="sub" ${ev.type === 'sub' ? 'selected' : ''}>Substitution</option>
          </select>
          <div style="display:flex; gap:6px;">
            <select class="psl-input" onchange="updateEvent(${i}, 'team', this.value)">${getTeamOpts(ev.team)}</select>
            ${ev.type !== 'sub' ? `
              <select class="psl-input" onchange="updateEvent(${i}, 'player', this.value)">${getPlayerOpts(ev.player)}</select>
              <input type="text" class="psl-input" style="width:70px;" placeholder="Score" value="${ev.scoreline || ''}" oninput="updateEvent(${i}, 'scoreline', this.value)">
            ` : `
              <select class="psl-input" onchange="updateEvent(${i}, 'player', this.value)"><option value="">-- IN --</option>${getPlayerOpts(ev.player)}</select>
              <select class="psl-input" onchange="updateEvent(${i}, 'playerOut', this.value)"><option value="">-- OUT --</option>${getPlayerOpts(ev.playerOut)}</select>
            `}
          </div>
        </div>`).join('');
    }

    function addAdminEvent() {
      adminEvents.push({ type: 'goal', team: '', player: '', playerOut: '', scoreline: '' });
      renderAdminEvents();
    }

    function removeAdminEvent(index) {
      adminEvents.splice(index, 1);
      renderAdminEvents();
    }

    function updateEvent(index, field, value) {
      adminEvents[index][field] = value;
      if (field === 'type') renderAdminEvents();
    }

    async function saveAdminMatch() {
      if (!confirm('Are you sure you want to save this match? This action cannot be reversed!')) {
        return;
      }
      const btn = document.getElementById('ae-btn');
      btn.disabled = true; btn.textContent = 'Saving...';

      const matchId = document.getElementById('ae-match-id').value;
      const hs = parseInt(document.getElementById('ae-hs').value);
      const as = parseInt(document.getElementById('ae-as').value);

      try {
        const db = await pslDbGet();
        if (!db.matches) db.matches = {};

        db.matches[matchId] = {
          hs: isNaN(hs) ? null : hs,
          as: isNaN(as) ? null : as,
          date: document.getElementById('ae-date').value,
          mvp: document.getElementById('ae-mvp').value,
          events: adminEvents
        };

        await pslDbSet(db);
        pslDbInvalidate();

        document.getElementById('ae-ok').style.display = 'block';
        document.getElementById('ae-err').style.display = 'none';

        const f = fixtures.find(x => x.id == matchId);
        if (f) {
          f.hs = db.matches[matchId].hs;
          f.as = db.matches[matchId].as;
          f.confirmed = f.hs !== null && f.as !== null;
          f.date = db.matches[matchId].date;
          f.mvp = db.matches[matchId].mvp;
          f.events = adminEvents;
        }

        if (typeof renderGroups === 'function') renderGroups();
        setTimeout(() => {
          if (adminEditModal) {
            adminEditModal.remove();
            adminEditModal = null;
          }
        }, 1000);
      } catch (e) {
        document.getElementById('ae-err').textContent = 'Error saving to database.';
        document.getElementById('ae-err').style.display = 'block';
      } finally {
        btn.disabled = false; btn.textContent = 'Save Match';
      }
    }

    window.onPslLogin = renderAdminControls;
    window.onPslLogout = renderAdminControls;

    injectAuthStyles();
    document.addEventListener('DOMContentLoaded', () => {
      pslAuthInit();
      syncMatchesFromDB();
    });
  </script>

  <div id="admin-edit-container"></div>

</body>
</html>
