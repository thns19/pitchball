<script>
const PSL_DB_URL = 'https://ptchbl4-default-rtdb.europe-west1.firebasedatabase.app/.json';
const TEAM_LOGOS = {
  'BADiles': 'logos/badiles.png', 'Volos Drummers': 'logos/volos.png', 'Midi Kidz': 'logos/midi.png',
  'Team Till Death': 'logos/ttd.png', 'Hornets': 'logos/hornets.png', 'EX7T': 'logos/ex7t.png',
  'R1': 'logos/r1.png', 'Basement Boys': 'logos/basement.png', 'Lampater': 'logos/lpc.png',
  'Polo': 'logos/polo.png', 'Ksades': 'logos/ksades.png', 'Air Condition': 'logos/ac.png',
  'Axtarmades': 'logos/axtar.png', 'Thryloi': 'logos/thryloi.png', 'Spasmena Mila': 'logos/spasmena.png',
  'Warriors': 'logos/warriors.png', 'Niki Alimou': 'logos/alimou.png', 'Golden B.': 'logos/gb.png'
};
let dbCache = null;
let currentCupExport = null;

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
}
function dbMatchCandidates(id) {
  const raw = String(id ?? '');
  return [...new Set([raw, `fixture-${raw}`])].filter(Boolean);
}
async function getDb() {
  if (dbCache) return dbCache;
  const response = await fetch(PSL_DB_URL);
  if (!response.ok) throw new Error('Database request failed');
  dbCache = await response.json();
  return dbCache;
}
function logoFor(team) {
  const source = TEAM_LOGOS[team];
  return source ? `<img class="match-team-logo" src="${source}" alt="${escapeHtml(team)} logo" onerror="this.style.display='none'">` : '';
}
function formatDate(value) {
  if (!value) return '';
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? String(value).replace('T', ' ') : date.toLocaleString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true }).replace(',', '');
}
function readMatch(db, id) {
  for (const key of dbMatchCandidates(id)) {
    if (db.matches && db.matches[key]) return db.matches[key];
  }
  return {};
}
function eventCounts(events, home) {
  let homeGoals = 0, awayGoals = 0, homeOwnGoals = 0, awayOwnGoals = 0;
  events.forEach(event => {
    const isHome = event.team === home;
    if (event.type === 'goal') isHome ? homeGoals++ : awayGoals++;
    if (event.type === 'og') isHome ? homeOwnGoals++ : awayOwnGoals++;
  });
  return { homeGoals, awayGoals, homeOwnGoals, awayOwnGoals };
}
function renderEvent(event, home, away) {
  const type = event.type || 'goal';
  if (type === 'sub') {
    return `<div class="event-row"><div class="event-icon icon-sub">SUB</div><div class="event-body"><div class="event-main">${escapeHtml(event.team || '')}</div><div class="event-detail">${escapeHtml(event.player || '')}${event.playerOut ? ` in / ${escapeHtml(event.playerOut)} out` : ''}</div></div><div class="event-score">-</div></div>`;
  }
  const isOwnGoal = type === 'og';
  const beneficiary = isOwnGoal ? (event.team === home ? away : home) : event.team;
  return `<div class="event-row"><div class="event-icon ${isOwnGoal ? 'icon-og' : 'icon-goal'}">${isOwnGoal ? 'OG' : 'G'}</div><div class="event-body"><div class="event-main"><strong>${escapeHtml(event.player || 'Unknown player')}</strong></div><div class="event-detail">${isOwnGoal ? `Own goal - point to ${escapeHtml(beneficiary || '')}` : `Goal - ${escapeHtml(event.team || '')}`}</div></div><div class="event-score">${escapeHtml(event.scoreline || '-')}</div></div>`;
}
function getCupPointScorer(event, home, away) {
  if (event.type === 'goal') {
    if (event.team === home) return true;
    if (event.team === away) return false;
  }
  if (event.type === 'og') {
    if (event.team === home) return false;
    if (event.team === away) return true;
  }
  return null;
}
function getCupExportRating(team) {
  const data = window.PSL6_DATA;
  const rating = data.cupRatings[team] || data.teams[team];
  if (rating) return rating.att * 0.35 + rating.def * 0.3 + rating.stm * 0.15 + rating.con * 0.2;
  const ratings = Object.values(data.teams);
  return ratings.reduce((total, entry) =>
    total + entry.att * 0.35 + entry.def * 0.3 + entry.stm * 0.15 + entry.con * 0.2, 0) / ratings.length;
}
function simulateCupWinChance(homeScore, awayScore, servingHome, homeRating, awayRating, target) {
  const simulationCount = 3000;
  let homeWins = 0;
  for (let simulation = 0; simulation < simulationCount; simulation++) {
    let scoreHome = homeScore;
    let scoreAway = awayScore;
    let serving = servingHome;
    while (scoreHome < target && scoreAway < target) {
      const pointChance = Math.max(0.15, Math.min(0.85,
        0.5 + (homeRating - awayRating) / 180 + (serving ? 0.025 : -0.025)));
      const homeWinsPoint = Math.random() < pointChance;
      if (homeWinsPoint) scoreHome++;
      else scoreAway++;
      serving = homeWinsPoint;
    }
    if (scoreHome > scoreAway) homeWins++;
  }
  return homeWins / simulationCount * 100;
}
function buildCupChanceTimeline() {
  const {home, away, events, round} = currentCupExport;
  const target = round.toLowerCase() === 'final' ? 7 : 5;
  const homeRating = getCupExportRating(home);
  const awayRating = getCupExportRating(away);
  let homeScore = 0;
  let awayScore = 0;
  const points = [];
  [...events].reverse().forEach(event => {
    const homeScored = getCupPointScorer(event, home, away);
    if (homeScored === null) return;
    if (homeScored) homeScore++;
    else awayScore++;
    points.push({
      homeScore,
      awayScore,
      homeChance: simulateCupWinChance(homeScore, awayScore, homeScored, homeRating, awayRating, target)
    });
  });
  return points;
}
function exportMatchEventLabel(event, home, away) {
  const scorer = getCupPointScorer(event, home, away);
  const score = event.scoreline ? ` · ${event.scoreline}` : '';
  if (event.type === 'sub') {
    return `Substitution · ${event.team || 'Team'} · ${event.player || 'Player in'}${event.playerOut ? ` for ${event.playerOut}` : ''}`;
  }
  if (event.type === 'og') {
    const beneficiary = event.team === home ? away : home;
    return `Own goal · ${event.player || 'Unknown player'} · point to ${beneficiary}${score}`;
  }
  if (event.type === 'goal') {
    return `Goal · ${event.player || 'Unknown player'} · ${scorer === null ? event.team || 'Unknown team' : scorer ? home : away}${score}`;
  }
  return `${event.type || 'Event'} · ${event.player || event.team || ''}${score}`;
}
function wrappedExportLines(context, text, maxWidth) {
  const words = String(text).split(/\s+/);
  let line = '';
  const lines = [];
  words.forEach(word => {
    const candidate = line ? `${line} ${word}` : word;
    if (line && context.measureText(candidate).width > maxWidth) {
      lines.push(line);
      line = word;
    } else {
      line = candidate;
    }
  });
  if (line) lines.push(line);
  return lines;
}
function drawWrappedExportText(context, text, x, y, maxWidth, lineHeight) {
  const lines = wrappedExportLines(context, text, maxWidth);
  lines.forEach((line, index) => context.fillText(line, x, y + index * lineHeight));
  return lines.length;
}
function drawCupChanceChart(context, points, home, away, top, width) {
  const left = 100;
  const right = width - 72;
  const chartTop = top + 105;
  const chartBottom = top + 330;
  const chartHeight = chartBottom - chartTop;
  const chartWidth = right - left;
  context.fillStyle = '#9b3218';
  context.font = '700 23px Arial, sans-serif';
  context.fillText('WIN PROBABILITY DURING THE MATCH', left, top + 16);
  context.font = '16px Arial, sans-serif';
  context.fillStyle = '#30201a';
  context.fillRect(left, top + 60, 14, 14);
  context.fillText(home, left + 23, top + 58, 390);
  context.fillStyle = '#bd3215';
  context.fillRect(left + 430, top + 60, 14, 14);
  context.fillStyle = '#30201a';
  context.fillText(away, left + 453, top + 58, 390);

  context.font = '15px Arial, sans-serif';
  [0, 50, 100].forEach(value => {
    const y = chartBottom - chartHeight * value / 100;
    context.strokeStyle = 'rgba(125,68,28,.24)';
    context.lineWidth = 1;
    context.beginPath();
    context.moveTo(left, y);
    context.lineTo(right, y);
    context.stroke();
    context.fillStyle = '#775b4c';
    context.textAlign = 'right';
    context.fillText(`${value}%`, left - 12, y + 5);
  });
  context.textAlign = 'left';

  if (!points.length) {
    context.fillStyle = '#775b4c';
    context.font = '18px Arial, sans-serif';
    context.fillText('No goal or own-goal events were available to simulate.', left, chartTop + 40);
    return;
  }

  const xFor = index => points.length === 1 ? left + chartWidth / 2 : left + chartWidth * index / (points.length - 1);
  const yFor = chance => chartBottom - chartHeight * chance / 100;
  [
    {key: 'homeChance', color: '#30201a'},
    {key: 'awayChance', color: '#bd3215', value: chance => 100 - chance}
  ].forEach(series => {
    context.strokeStyle = series.color;
    context.lineWidth = 4;
    context.lineJoin = 'round';
    context.lineCap = 'round';
    context.beginPath();
    points.forEach((point, index) => {
      const chance = series.value ? series.value(point.homeChance) : point[series.key];
      const x = xFor(index);
      const y = yFor(chance);
      if (index === 0) context.moveTo(x, y);
      else context.lineTo(x, y);
    });
    context.stroke();
    points.forEach((point, index) => {
      const chance = series.value ? series.value(point.homeChance) : point[series.key];
      context.beginPath();
      context.arc(xFor(index), yFor(chance), 4, 0, Math.PI * 2);
      context.fillStyle = series.color;
      context.fill();
    });
  });
  context.font = '14px Arial, sans-serif';
  context.fillStyle = '#775b4c';
  points.forEach((point, index) => {
    const x = xFor(index);
    context.textAlign = index === 0 ? 'left' : index === points.length - 1 ? 'right' : 'center';
    context.fillText(`${point.homeScore}-${point.awayScore}`, x, chartBottom + 28);
  });
  context.textAlign = 'left';
}
function loadExportImage(source) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = () => reject(new Error(`Unable to load export image: ${source}`));
    image.src = source;
  });
}
function roundedExportRect(context, x, y, width, height, radius) {
  const r = Math.min(radius, width / 2, height / 2);
  context.beginPath();
  context.moveTo(x + r, y);
  context.arcTo(x + width, y, x + width, y + height, r);
  context.arcTo(x + width, y + height, x, y + height, r);
  context.arcTo(x, y + height, x, y, r);
  context.arcTo(x, y, x + r, y, r);
  context.closePath();
  context.fill();
}
function cupExportLogoSource(team) {
  const logo = window.PSL6_DATA.logos[team] || {
    Sapioi: 'logos/sapioi.png',
    Kritsinia: 'logos/kritsinia.png'
  }[team];
  return logo ? new URL(logo, window.location.href).href : '';
}
function makeExportSafeImage(image) {
  const canvas = document.createElement('canvas');
  canvas.width = 96;
  canvas.height = 96;
  const context = canvas.getContext('2d');
  if (!context) throw new Error('Your browser could not prepare a team logo for export.');
  const scale = Math.min(canvas.width / image.width, canvas.height / image.height);
  const width = image.width * scale;
  const height = image.height * scale;
  context.drawImage(image, (canvas.width - width) / 2, (canvas.height - height) / 2, width, height);
  context.getImageData(0, 0, 1, 1);
  return loadExportImage(canvas.toDataURL('image/png'));
}
async function loadCupExportLogo(team) {
  const source = cupExportLogoSource(team);
  if (!source) return null;
  if (window.location.protocol === 'file:') return makeExportSafeImage(await loadExportImage(source));
  const response = await fetch(source, {mode: 'cors'});
  if (!response.ok) throw new Error(`Logo request failed with status ${response.status}.`);
  const objectUrl = URL.createObjectURL(await response.blob());
  try {
    const logo = await loadExportImage(objectUrl);
    return await makeExportSafeImage(logo);
  } finally {
    URL.revokeObjectURL(objectUrl);
  }
}
async function exportCupMatch(includeChances) {
  if (!currentCupExport) {
    alert('Cup match data is not available for export.');
    return;
  }
  try {
    const {id, home, away, round, match, events} = currentCupExport;
    const points = includeChances ? buildCupChanceTimeline() : [];
    if (!window.PSL_EXPORT_BACKGROUND_DATA) throw new Error('The export background did not load. Please reload the match page and try again.');
    const background = await loadExportImage(window.PSL_EXPORT_BACKGROUND_DATA);
    const [homeLogo, awayLogo] = await Promise.all([home, away].map(async team => {
      try {
        return await loadCupExportLogo(team);
      } catch (error) {
        console.warn(`Unable to load the ${team} logo for the match export.`, error);
        return null;
      }
    }));
    const width = 1400;
    const padding = 64;
    const eventTop = 320;
    const eventLineHeight = 24;
    const eventRowGap = 20;
    const exportEvents = events.length ? [...events].reverse() : [{type: 'none'}];
    const eventLabels = ['Match Start', ...exportEvents.map((event, index) =>
      event.type === 'none' ? 'No event data available.' : `${String(index + 1).padStart(2, '0')}  ${exportMatchEventLabel(event, home, away)}`
    )];
    const measureCanvas = document.createElement('canvas');
    const measureContext = measureCanvas.getContext('2d');
    if (!measureContext) throw new Error('Your browser could not measure the match export text.');
    measureContext.font = '17px Arial, sans-serif';
    const eventBlockHeight = eventLabels.reduce((height, label) =>
      height + Math.max(eventRowGap, wrappedExportLines(measureContext, label, width - padding * 2).length * eventLineHeight) + 18, 0);
    const chartHeight = includeChances ? 430 : 0;
    const height = eventTop + eventBlockHeight + chartHeight + padding;
    const scale = Math.min(1, Math.sqrt(4000000 / (width * height)), 32000 / height);
    const canvas = document.createElement('canvas');
    canvas.width = Math.floor(width * scale);
    canvas.height = Math.floor(height * scale);
    const context = canvas.getContext('2d');
    if (!context) throw new Error('Your browser could not create the match export image.');
    context.scale(scale, scale);
    const imageScale = Math.max(width / background.width, height / background.height);
    const imageWidth = background.width * imageScale;
    const imageHeight = background.height * imageScale;
    context.drawImage(background, (width - imageWidth) / 2, (height - imageHeight) / 2, imageWidth, imageHeight);
    try {
      context.getImageData(0, 0, 1, 1);
    } catch (error) {
      throw new Error('The export background could not be embedded in the PNG.');
    }
    context.fillStyle = 'rgba(255,249,235,.10)';
    roundedExportRect(context, 32, 32, width - 64, 210, 20);
    context.fillStyle = 'rgba(255,249,235,.10)';
    roundedExportRect(context, 32, 260, width - 64, eventBlockHeight + 48, 18);
    if (includeChances) {
      context.fillStyle = 'rgba(255,249,235,.10)';
      roundedExportRect(context, 32, eventTop + eventBlockHeight + 18, width - 64, chartHeight - 8, 18);
    }
    context.textBaseline = 'top';

    context.fillStyle = '#9b3218';
    context.font = '700 17px Arial, sans-serif';
    context.fillText(`PSL6 CUP  ·  ${round.toUpperCase()}`, padding, 58);
    context.fillStyle = '#30201a';
    context.font = '700 34px Arial, sans-serif';
    if (homeLogo) context.drawImage(homeLogo, padding, 100, 46, 46);
    context.textAlign = 'left';
    context.fillText(home, padding + (homeLogo ? 60 : 0), 106, 420);
    context.textAlign = 'center';
    context.font = '700 48px Arial, sans-serif';
    context.fillText(`${match.hs ?? '-'}  -  ${match.as ?? '-'}`, width / 2, 100);
    context.textAlign = 'right';
    context.font = '700 34px Arial, sans-serif';
    context.fillText(away, width - padding - (awayLogo ? 60 : 0), 106, 420);
    if (awayLogo) context.drawImage(awayLogo, width - padding - 46, 100, 46, 46);
    context.textAlign = 'left';
    context.fillStyle = '#775b4c';
    context.font = '16px Arial, sans-serif';
    const metadata = [match.date ? formatDate(match.date) : '', match.mvp ? `MVP: ${match.mvp}` : ''].filter(Boolean).join('  ·  ');
    if (metadata) context.fillText(metadata, padding, 168, width - padding * 2);

    context.fillStyle = '#9b3218';
    context.font = '700 18px Arial, sans-serif';
    context.fillText('MATCH EVENTS', padding, 220);
    context.strokeStyle = 'rgba(125,68,28,.28)';
    context.beginPath();
    context.moveTo(padding, 250);
    context.lineTo(width - padding, 250);
    context.stroke();
    context.fillStyle = '#f2f0eb';
    context.font = '17px Arial, sans-serif';
    let y = eventTop;
    eventLabels.forEach(label => {
      const lineCount = drawWrappedExportText(context, label, padding, y, width - padding * 2, eventLineHeight);
      y += Math.max(eventRowGap, lineCount * eventLineHeight) + 18;
    });

    if (includeChances) drawCupChanceChart(context, points, home, away, eventTop + eventBlockHeight + 28, width);
    context.getImageData(0, 0, 1, 1);
    try {
      canvas.toBlob(blob => {
        if (!blob) {
          alert('The match export image could not be created.');
          return;
        }
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `${id.toLowerCase()}${includeChances ? '-chances' : ''}.png`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }, 'image/png');
    } catch (error) {
      throw new Error(`The match export image could not be saved: ${error.message || 'unknown error'}`);
    }
  } catch (error) {
    console.error('Cup match export failed.', error);
    alert(error.message || 'Unable to export this cup match.');
  }
}
async function initMatch() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const home = params.get('home') || 'Home team';
  const away = params.get('away') || 'Away team';
  const group = params.get('group') || 'Group stage';
  const md = params.get('md') || '-';
  const isCupMatch = params.get('cup') === '1';
  const round = params.get('round') || group;
  const content = document.getElementById('match-content');
  if (isCupMatch) {
    const backLink = document.getElementById('match-back-link');
    backLink.href = 'cup.html';
    backLink.innerHTML = '&larr; PSL6 Cup';
  }
  if (!id) {
    content.innerHTML = `<div class="no-data">Match not found. <a class="back" href="${isCupMatch ? 'cup.html' : 'table.html'}">Back to ${isCupMatch ? 'cup' : 'table'}</a></div>`;
    return;
  }
  try {
    const db = await getDb();
    const match = readMatch(db, id);
    const events = Array.isArray(match.events) ? match.events : [];
    if (isCupMatch && match && Object.keys(match).length) {
      currentCupExport = {id, home, away, round, match, events};
      document.getElementById('match-export-controls').hidden = false;
    }
    const counts = eventCounts(events, home);
    const homeScore = match.hs !== undefined && match.hs !== null ? match.hs : '-';
    const awayScore = match.as !== undefined && match.as !== null ? match.as : '-';
    const eventRows = events.length ? events.map(event => renderEvent(event, home, away)).join('') : '<div class="no-data">No event data available yet.</div>';
    const competition = isCupMatch ? 'PSL6 Cup' : 'PSL6 Group Stage';
    document.title = `${home} vs ${away} - ${competition}`;
    content.innerHTML = `
      <section class="match-header">
        <div class="match-kicker">${isCupMatch ? `${escapeHtml(competition)} - ${escapeHtml(round)}` : `${escapeHtml(group)} - Matchday ${escapeHtml(md)}`}</div>
        <div class="match-teams">
          <div class="match-team">${logoFor(home)}<div class="match-team-name">${escapeHtml(home)}</div></div>
          <div class="match-score">${escapeHtml(homeScore)}-${escapeHtml(awayScore)}</div>
          <div class="match-team">${logoFor(away)}<div class="match-team-name">${escapeHtml(away)}</div></div>
        </div>
        <div class="match-meta">${match.date ? `<span>${escapeHtml(formatDate(match.date))}</span>` : ''}<span>${escapeHtml(competition)}</span></div>
      </section>
      ${match.mvp ? `<section class="content-card mvp-card"><span class="mvp-icon">&#127942;</span><div><div class="mvp-label">Match MVP</div><div class="mvp-name">${escapeHtml(match.mvp)}</div></div></section>` : ''}
      <section class="content-card"><div class="card-title">Match statistics</div><div class="stats-grid"><div class="stat"><span class="stat-label">${escapeHtml(home)} goals</span><span class="stat-value">${counts.homeGoals}</span></div><div class="stat"><span class="stat-label">${escapeHtml(away)} goals</span><span class="stat-value">${counts.awayGoals}</span></div><div class="stat"><span class="stat-label">${escapeHtml(home)} own goals</span><span class="stat-value">${counts.homeOwnGoals}</span></div><div class="stat"><span class="stat-label">${escapeHtml(away)} own goals</span><span class="stat-value">${counts.awayOwnGoals}</span></div></div></section>
      <section class="content-card"><div class="card-title">Match events</div>${eventRows}</section>`;
  } catch (error) {
    content.innerHTML = `<div class="no-data">Unable to load this match right now. <a class="back" href="${isCupMatch ? 'cup.html' : 'table.html'}">Back to ${isCupMatch ? 'cup' : 'table'}</a></div>`;
  }
}
window.addEventListener('DOMContentLoaded', initMatch);
</script>
<script>
const COMMENT_REACTIONS = ['Like', 'Goal', 'Fire'];
function commentUser() {
  try { return JSON.parse(localStorage.getItem('psl_session') || 'null'); } catch (error) { return null; }
}
function commentTime(value) {
  const minutes = Math.floor((Date.now() - new Date(value).getTime()) / 60000);
  if (!Number.isFinite(minutes) || minutes < 1) return 'just now';
  if (minutes < 60) return `${minutes}m ago`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `${hours}h ago`;
  return new Date(value).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
function commentAvatar(user) {
  const name = user || '?';
  return `<div class="comment-avatar">${escapeHtml(name.charAt(0).toUpperCase())}</div>`;
}
function commentReactionButtons(matchId, comment, isReply, parentId) {
  const user = commentUser();
  return COMMENT_REACTIONS.map(reaction => {
    const users = (comment.reactions || {})[reaction] || [];
    if (!users.length && !user) return '';
    const reacted = user && users.includes(user.username) ? ' reacted' : '';
    return `<button class="comment-action${reacted}" onclick="toggleCommentReaction('${matchId}','${comment.id}',${isReply ? `'${parentId}'` : 'null'},'${reaction}')">${reaction}${users.length ? ` ${users.length}` : ''}</button>`;
  }).join('');
}
function renderComment(matchId, comment, isReply = false, parentId = '') {
  const user = commentUser();
  const canDelete = user && (user.isAdmin || user.username === comment.user);
  const replies = !isReply && Array.isArray(comment.replies) ? comment.replies : [];
  const replyMarkup = replies.length ? `<div class="comment-replies">${replies.map(reply => renderComment(matchId, reply, true, comment.id)).join('')}</div>` : '';
  const replyBox = !isReply && user ? `<div class="reply-box" id="reply-box-${comment.id}"><textarea id="reply-input-${comment.id}" rows="1" placeholder="Write a reply..."></textarea><button class="comment-submit" onclick="postCommentReply('${matchId}','${comment.id}')">Post</button></div>` : '';
  return `<article class="comment">${commentAvatar(comment.user)}<div class="comment-body"><div class="comment-header"><span class="comment-user">${escapeHtml(comment.user)}</span><span class="comment-time">${commentTime(comment.time)}</span></div><div class="comment-text">${escapeHtml(comment.text)}</div><div class="comment-actions">${commentReactionButtons(matchId, comment, isReply, parentId)}${!isReply && user ? `<button class="comment-action" onclick="toggleReplyBox('${comment.id}')">Reply</button>` : ''}${canDelete ? `<button class="comment-action" onclick="deleteComment('${matchId}','${comment.id}',${isReply ? `'${parentId}'` : 'null'})">Delete</button>` : ''}</div>${replyMarkup}${replyBox}</div></article>`;
}
function renderComments(matchId, comments) {
  const mount = document.getElementById('comments-mount');
  if (!mount) return;
  const user = commentUser();
  const count = comments.reduce((total, comment) => total + 1 + (comment.replies || []).length, 0);
  const composer = user
    ? `<div class="comment-compose"><textarea id="new-comment" rows="2" placeholder="Share your thoughts..."></textarea><div class="comment-compose-footer"><button class="comment-submit" onclick="postComment('${matchId}')">Post comment</button></div></div>`
    : `<div class="comment-compose"><div class="comment-login">Sign in on the <a href="table.html">league table</a> to comment.</div></div>`;
  const list = comments.length ? comments.map(comment => renderComment(matchId, comment)).join('') : '<div class="no-data">No comments yet.</div>';
  mount.innerHTML = `<section class="comments"><div class="comments-title">Comments <span class="comments-count">${count}</span></div>${composer}<div>${list}</div></section>`;
}
async function loadComments() {
  const matchId = new URLSearchParams(window.location.search).get('id');
  if (!matchId) return;
  try {
    const db = await getDb();
    renderComments(matchId, Array.isArray((db.comments || {})[matchId]) ? db.comments[matchId] : []);
  } catch (error) {
    document.getElementById('comments-mount').innerHTML = '<div class="no-data">Unable to load comments.</div>';
  }
}
async function saveComments(matchId, comments) {
  const db = await getDb();
  if (!db.comments) db.comments = {};
  db.comments[matchId] = comments;
  dbCache = db;
  const response = await fetch(PSL_DB_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(db) });
  if (!response.ok) throw new Error('Comment save failed');
  renderComments(matchId, comments);
}
async function postComment(matchId) {
  const user = commentUser();
  const input = document.getElementById('new-comment');
  const text = input ? input.value.trim() : '';
  if (!user || !text) return;
  const db = await getDb();
  const comments = Array.isArray((db.comments || {})[matchId]) ? db.comments[matchId] : [];
  comments.unshift({ id: `c${Date.now()}`, user: user.username, avatar: user.avatar || null, text, time: new Date().toISOString(), reactions: {}, replies: [] });
  await saveComments(matchId, comments);
}
async function postCommentReply(matchId, parentId) {
  const user = commentUser();
  const input = document.getElementById(`reply-input-${parentId}`);
  const text = input ? input.value.trim() : '';
  if (!user || !text) return;
  const db = await getDb();
  const comments = Array.isArray((db.comments || {})[matchId]) ? db.comments[matchId] : [];
  const parent = comments.find(comment => comment.id === parentId);
  if (!parent) return;
  if (!Array.isArray(parent.replies)) parent.replies = [];
  parent.replies.push({ id: `r${Date.now()}`, user: user.username, avatar: user.avatar || null, text, time: new Date().toISOString(), reactions: {} });
  await saveComments(matchId, comments);
}
async function toggleCommentReaction(matchId, commentId, parentId, reaction) {
  const user = commentUser();
  if (!user) return;
  const db = await getDb();
  const comments = Array.isArray((db.comments || {})[matchId]) ? db.comments[matchId] : [];
  const parent = parentId ? comments.find(comment => comment.id === parentId) : null;
  const comment = parent ? (parent.replies || []).find(reply => reply.id === commentId) : comments.find(item => item.id === commentId);
  if (!comment) return;
  if (!comment.reactions) comment.reactions = {};
  if (!comment.reactions[reaction]) comment.reactions[reaction] = [];
  const index = comment.reactions[reaction].indexOf(user.username);
  if (index >= 0) comment.reactions[reaction].splice(index, 1); else comment.reactions[reaction].push(user.username);
  await saveComments(matchId, comments);
}
async function deleteComment(matchId, commentId, parentId) {
  const user = commentUser();
  if (!user || !confirm('Delete this comment?')) return;
  const db = await getDb();
  const comments = Array.isArray((db.comments || {})[matchId]) ? db.comments[matchId] : [];
  if (parentId) {
    const parent = comments.find(comment => comment.id === parentId);
    if (parent) parent.replies = (parent.replies || []).filter(reply => reply.id !== commentId);
  } else {
    const target = comments.find(comment => comment.id === commentId);
    if (!target || (!user.isAdmin && target.user !== user.username)) return;
    db.comments[matchId] = comments.filter(comment => comment.id !== commentId);
  }
  await saveComments(matchId, comments);
}
function toggleReplyBox(commentId) {
  document.getElementById(`reply-box-${commentId}`)?.classList.toggle('open');
}
window.addEventListener('DOMContentLoaded', loadComments);
</script>
